<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="katex.min.css">
  <style>
    html, body { margin:0; padding:0; background:transparent; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
    #content { color:#1f2937; font-size:15px; line-height:1.85; word-break:break-word; }
    p { margin: 0.55em 0; }
    strong { font-weight: 700; }
    h1,h2,h3,h4 { font-size:16px; font-weight:700; margin:0.85em 0 0.4em; }
    pre { background:#1e1e1e; color:#d4d4d4; padding:10px; border-radius:8px; overflow-x:auto; }
    code { background:#f0f0f0; padding:2px 6px; border-radius:4px; }
    .katex { font-size: 1.1em; }
    .katex-display, .math-scroll { overflow-x:auto; overflow-y:hidden; margin:0.35em 0; text-align:left; }
    .katex-error, .math-plain { color:#1f2937 !important; background:transparent !important; }
    .cursor { color:#4ecdc4; animation:blink .9s infinite; }
    @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0;} }
  </style>
</head>
<body>
  <div id="content"></div>
  <script src="marked.min.js"></script>
  <script src="katex.min.js"></script>
  <script>
    if (window.marked && marked.setOptions) marked.setOptions({ breaks: true, gfm: true });
    function parseMarkdown(src) {
      var m = window.marked;
      if (!m) return escapeHtml(src).replace(/\n/g, "<br>");
      if (typeof m.parse === "function") return m.parse(src);
      if (typeof m === "function") return m(src);
      return escapeHtml(src).replace(/\n/g, "<br>");
    }
    var BS = String.fromCharCode(92);
    var DOL = String.fromCharCode(36);
    function escapeHtml(s) {
      return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }
    function isMultiLineLatex(src) {
      var re = new RegExp(BS + BS + "|" + BS + "begin\\{(?:aligned|align\\*?|split|gather\\*?|multline\\*?|cases|array|matrix|pmatrix|bmatrix|vmatrix|Bmatrix|smallmatrix|gathered)\\}");
      return re.test(src);
    }
    function maskUnclosed(md) {
      var s = String(md || ""), n = s.length, i = 0, openAt = -1, kind = "";
      while (i < n) {
        var c = s.charAt(i), n1 = s.charAt(i + 1);
        if (c === DOL && n1 === DOL) { if (kind === "dd") { kind = ""; openAt = -1; } else if (kind === "") { kind = "dd"; openAt = i; } i += 2; continue; }
        if (c === DOL) { if (kind === "d") { kind = ""; openAt = -1; } else if (kind === "") { kind = "d"; openAt = i; } i += 1; continue; }
        if (c === BS && n1 === "[") { if (kind === "") { kind = "br"; openAt = i; } i += 2; continue; }
        if (c === BS && n1 === "]") { if (kind === "br") { kind = ""; openAt = -1; } i += 2; continue; }
        if (c === BS && n1 === "(") { if (kind === "") { kind = "p"; openAt = i; } i += 2; continue; }
        if (c === BS && n1 === ")") { if (kind === "p") { kind = ""; openAt = -1; } i += 2; continue; }
        i += 1;
      }
      if (openAt < 0) return { body: s, tail: "" };
      return { body: s.slice(0, openAt), tail: s.slice(openAt) };
    }
    function wrapBareEnvs(md) {
      var re = new RegExp(BS + "begin\\{([a-zA-Z*]+)\\}([\\s\\S]*?)" + BS + "end\\{\\1\\}", "g");
      return String(md || "").replace(re, function(m, env, body, offset, src) {
        var before = src.slice(Math.max(0, offset - 2), offset);
        if (before === DOL + DOL) return m;
        return DOL + DOL + m + DOL + DOL;
      });
    }
    function renderMath(md) {
      var idx = 0, blocks = [];
      function protect(latex, display) {
        var src = String(latex || "").replace(/\r/g, "");
        var multi = isMultiLineLatex(src);
        if (!multi) src = src.replace(/[ \t]*\n[ \t]*/g, " ").replace(/[ \t]{2,}/g, " ");
        src = src.trim();
        if (!src) return "";
        var drawn = "";
        try {
          if (window.katex && katex.renderToString) {
            drawn = katex.renderToString(src, {displayMode: !!display || multi, throwOnError: false, strict: "ignore"});
          }
        } catch (e) { drawn = ""; }
        var html = "";
        if (!drawn || drawn.indexOf("katex-error") >= 0) html = "<span class='math-plain'>" + escapeHtml(src) + "</span>";
        else if (display || multi) html = "<div class='katex-display'>" + drawn + "</div>";
        else html = drawn;
        var key = "@@KATEX" + (idx++) + "@@";
        blocks.push({key: key, html: html});
        return key;
      }
      md = wrapBareEnvs(String(md || ""));
      md = md.split(BS + DOL).join(DOL);
      var brack = new RegExp(BS + "\\[([\\s\\S]*?)" + BS + "\\]", "g");
      md = md.replace(brack, function(_, p1) { return protect(p1, true); });
      var paren = new RegExp(BS + "\\(([\\s\\S]*?)" + BS + "\\)", "g");
      md = md.replace(paren, function(_, p1) { return protect(p1, false); });
      var drawn = "", cursor = 0;
      while (cursor < md.length) {
        if (md.charAt(cursor) === DOL && md.charAt(cursor + 1) === DOL) {
          var endDisplay = md.indexOf(DOL + DOL, cursor + 2);
          if (endDisplay < 0) { drawn += md.slice(cursor); break; }
          drawn += protect(md.slice(cursor + 2, endDisplay), true);
          cursor = endDisplay + 2; continue;
        }
        if (md.charAt(cursor) === DOL) {
          var endInline = md.indexOf(DOL, cursor + 1);
          if (endInline < 0) { drawn += md.slice(cursor); break; }
          drawn += protect(md.slice(cursor + 1, endInline), false);
          cursor = endInline + 1; continue;
        }
        drawn += md.charAt(cursor);
        cursor += 1;
      }
      var html = parseMarkdown(drawn.replace(/\n{3,}/g, "\n\n") || "");
      blocks.forEach(function(b) { html = html.split(b.key).join(b.html); });
      return html;
    }
    function heightOf() {
      var root = document.getElementById("content");
      return Math.max(document.body.scrollHeight, document.documentElement.scrollHeight, root ? root.scrollHeight : 0);
    }
    window.setQaHtml = function(html) {
      var root = document.getElementById("content");
      if (!root) return 0;
      root.innerHTML = html || "";
      return heightOf();
    };
    window.setQaContent = function(md, streaming) {
      var root = document.getElementById("content");
      if (!root) return 0;
      try {
        var masked = streaming ? maskUnclosed(md || "") : { body: String(md || ""), tail: "" };
        root.innerHTML = renderMath(masked.body);
        if (masked.tail) {
          var tail = document.createElement("span");
          tail.className = "math-plain";
          tail.textContent = masked.tail;
          root.appendChild(tail);
        }
      } catch (e) {
        root.innerHTML = escapeHtml(String(md || "")).replace(/\n/g, "<br>");
      }
      if (streaming) {
        var cursor = document.createElement("span");
        cursor.className = "cursor";
        cursor.textContent = "◊";
        root.appendChild(cursor);
      }
      return heightOf();
    };
  </script>
</body>
</html>
